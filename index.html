<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B6E5B">
<meta name="description" content="BDIX হোস্টিং — বাংলাদেশের দর্শকের জন্য দ্রুত ওয়েবসাইট হোস্টিং। বিকাশ ও নগদে পেমেন্ট।">
<style>:root{color-scheme:light}html{-webkit-text-size-adjust:100%}[hidden]{display:none!important}img{max-width:100%}</style>
<title>ধারা হোস্ট</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230B6E5B'/%3E%3Cpath d='M6 20c4-8 8-8 10 0s6 8 10 0' fill='none' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<script>
/* set theme + js flag before first paint */
(function(){try{var t=localStorage.getItem("dh_theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);}catch(e){}document.documentElement.className+=" js";})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@500;700;800&family=Hind+Siliguri:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* ============ Dhara Host — single-file site ============
   Views (hash routes): #/ home · #/checkout/<plan>/<cycle> · #/done/<orderId> · #/track[/<orderId>]
   Look: calm teal "flow" identity. Motion respects prefers-reduced-motion. */
:root{
  --bg:#F1F5F2; --surface:#FFFFFF; --ink:#10201D; --muted:#4F625E; --line:#D5DFDA;
  --accent:#0B6E5B; --accent-ink:#FFFFFF; --soft:#E3EEE9; --signal:#9A5A00; --signal-bg:#FBEBCF;
  --bkash:#C21A62; --bkash-bg:#FBE3EE; --bkash-ink:#FFFFFF;
  --nagad:#C4470A; --nagad-bg:#FDE9DB; --nagad-ink:#FFFFFF;
  --ok:#0B6E5B; --err:#B3261E; --shadow:0 14px 34px -16px rgba(16,32,29,.35);
  --display:"Anek Bangla","Hind Siliguri",system-ui,sans-serif;
  --body:"Hind Siliguri","Anek Bangla",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1715; --surface:#13221F; --ink:#E6F0EC; --muted:#9DB3AC; --line:#25403A;
    --accent:#3FBF9F; --accent-ink:#04201A; --soft:#172B27; --signal:#F0B45A; --signal-bg:#33260F;
    --bkash:#F0508F; --bkash-bg:#34121F; --bkash-ink:#2A0214;
    --nagad:#FF8A4C; --nagad-bg:#38200F; --nagad-ink:#2B1004;
    --ok:#3FBF9F; --err:#FF8A80; --shadow:0 14px 34px -16px rgba(0,0,0,.7); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1715; --surface:#13221F; --ink:#E6F0EC; --muted:#9DB3AC; --line:#25403A;
  --accent:#3FBF9F; --accent-ink:#04201A; --soft:#172B27; --signal:#F0B45A; --signal-bg:#33260F;
  --bkash:#F0508F; --bkash-bg:#34121F; --bkash-ink:#2A0214;
  --nagad:#FF8A4C; --nagad-bg:#38200F; --nagad-ink:#2B1004;
  --ok:#3FBF9F; --err:#FF8A80; --shadow:0 14px 34px -16px rgba(0,0,0,.7); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.65 var(--body);margin:0;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
h1,h2,h3{font-family:var(--display);line-height:1.25;margin:0;text-wrap:balance}
p{margin:0}
a{color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.skip{position:absolute;left:-999px;top:8px;background:var(--accent);color:var(--accent-ink);padding:8px 14px;border-radius:8px;z-index:50}
.skip:focus{left:8px}
:focus-visible{outline:3px solid var(--signal);outline-offset:2px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:600 16px/1 var(--body);padding:13px 20px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer;text-decoration:none;transition:transform .15s ease,filter .15s ease,box-shadow .15s ease}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.sm{padding:10px 16px;font-size:15px}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--accent);filter:none}
.btn.pink{background:var(--bkash);border-color:var(--bkash);color:var(--bkash-ink)}
.btn.mc{background:var(--mc);border-color:var(--mc);color:var(--mc-ink)}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
.btn svg{width:18px;height:18px;flex:none}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font:600 13px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.eyebrow .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:ping 2s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 55%,transparent)}80%,100%{box-shadow:0 0 0 9px transparent}}

/* progress + header */
#prog{position:fixed;left:0;top:0;height:3px;width:0;background:linear-gradient(90deg,var(--accent),var(--signal));z-index:60;transition:width .1s linear}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
@supports (background:color-mix(in srgb,red,blue)){.top{background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}}
.top .wrap{display:flex;align-items:center;gap:14px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;font:800 21px/1 var(--display);text-decoration:none;white-space:nowrap}
.brand svg{width:30px;height:30px;flex:none}
.brand svg path{stroke-dasharray:60;animation:draw 2.4s ease-out both}
@keyframes draw{from{stroke-dashoffset:60}to{stroke-dashoffset:0}}
.nav{display:flex;gap:2px;margin-inline:auto}
.nav a{padding:8px 12px;border-radius:8px;text-decoration:none;color:var(--muted);font-weight:500;font-size:15px;white-space:nowrap}
.nav a:hover,.nav a.on{color:var(--ink);background:var(--soft)}
.ctls{display:flex;align-items:center;gap:8px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;padding:2px;background:var(--surface)}
.seg button{font:600 13px var(--body);padding:6px 10px;border:0;border-radius:6px;background:transparent;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.icon-btn{width:38px;height:38px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;cursor:pointer}
.icon-btn:hover{border-color:var(--accent)}
.icon-btn svg{width:18px;height:18px}
.menu-btn{display:none}
@media (max-width:980px){
  .menu-btn{display:grid}
  .nav{display:none;position:absolute;left:0;right:0;top:100%;flex-direction:column;margin:0;padding:10px 16px 16px;background:var(--bg);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
  .top.open .nav{display:flex}
  .nav a{padding:12px;font-size:16px}
  .ctls{margin-left:auto}
}
@media (max-width:560px){.hide-sm{display:none}.brand{font-size:19px}}

/* reveal */
.js .rv{opacity:0;transform:translateY(18px);transition:opacity .6s ease,transform .6s ease;transition-delay:var(--d,0s)}
.js .rv.in{opacity:1;transform:none}

/* hero */
.hero{position:relative;padding-block:56px 84px;overflow:hidden;overflow:clip}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 1px 1px,var(--line) 1px,transparent 0) 0 0/26px 26px;opacity:.55;-webkit-mask-image:linear-gradient(#000 40%,transparent);mask-image:linear-gradient(#000 40%,transparent)}
.waves{position:absolute;left:0;right:0;bottom:0;height:84px;pointer-events:none}
.waves svg{position:absolute;left:0;bottom:0;width:200%;height:100%;animation:wave 22s linear infinite}
.waves svg.b{animation-duration:34s;animation-direction:reverse;opacity:.55;bottom:-8px}
.waves path{fill:var(--soft)}
.waves svg.b path{fill:var(--accent);opacity:.18}
@keyframes wave{to{transform:translateX(-50%)}}
.hero-grid{position:relative;display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center}
.hero h1{font-size:clamp(32px,5.2vw,54px);font-weight:800;margin-block:14px 16px}
.hero h1 em{font-style:normal;color:var(--accent);background:linear-gradient(transparent 70%,color-mix(in srgb,var(--signal) 28%,transparent) 0)}
.hero .lead{color:var(--muted);font-size:18px;max-width:34em}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}
.chips{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:22px 0 0;padding:0}
.chips li{display:flex;align-items:center;gap:7px;font-size:14px;padding:6px 12px;border:1px solid var(--line);border-radius:99px;background:var(--surface);color:var(--muted)}
.chips li::before{content:"✓";color:var(--accent);font-weight:700}
.ruler{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;min-width:0;box-shadow:var(--shadow)}
.ruler h3{font-size:17px;margin-bottom:4px}
.ruler .sub{font-size:13px;color:var(--muted);margin-bottom:10px}
.row{display:grid;grid-template-columns:112px 1fr 52px;gap:10px;align-items:center;margin-block:12px;font-size:14px}
.bar{height:12px;background:var(--soft);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--muted);border-radius:4px;transition:width 1.2s cubic-bezier(.2,.8,.2,1) .3s}
.rv.in .bar i,.no-js .bar i{width:var(--w)}
.row.us .bar i{background:var(--accent)}
.row b{font:500 13px var(--mono);text-align:right}
.ruler .note{font-size:12.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:12px;margin-top:14px}
@media (max-width:900px){.hero-grid{grid-template-columns:1fr;gap:32px}.hero{padding-block:36px 76px}.row{grid-template-columns:104px 1fr 48px}}

/* network illustration */
.net{display:block;width:100%;height:auto;margin-bottom:8px}
.net .route{fill:none;stroke-width:2.5;stroke-linecap:round}
.net .short{stroke:var(--accent)}
.net .long{stroke:var(--muted);stroke-dasharray:3 7;opacity:.7}
.net .node{fill:var(--surface);stroke:var(--line);stroke-width:2}
.net .hubc{fill:var(--accent)}
.net .pulse{fill:none;stroke:var(--accent);stroke-width:2;transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.1);opacity:0}}
.net .pk.s{fill:var(--accent)}
.net .pk.l{fill:var(--muted)}
.net .ico{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.net text{font:600 14px var(--body);fill:var(--muted);text-anchor:middle}
.net text.hub{fill:var(--accent-ink);font:800 12px var(--display)}
.net text.tag{fill:var(--accent)}

/* marquee */
.marquee{border-block:1px solid var(--line);background:var(--surface);overflow:hidden;white-space:nowrap}
.marquee .track{display:inline-flex;gap:0;animation:marq 38s linear infinite;padding-block:13px}
.marquee:hover .track{animation-play-state:paused}
.marquee span{font:600 15px var(--display);color:var(--muted);padding-inline:22px;display:inline-flex;align-items:center;gap:22px}
.marquee span::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);opacity:.7}
@keyframes marq{to{transform:translateX(-50%)}}

/* sections */
section.block{padding-block:64px;border-top:1px solid var(--line);scroll-margin-top:60px}
.marquee + section.block{border-top:0}
.head{max-width:40em;margin-bottom:30px;display:grid;gap:10px}
.head h2{font-size:clamp(26px,3.6vw,36px);font-weight:800}
.head p{color:var(--muted)}
.why{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}
.why>div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease}
.why>div:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:var(--accent)}
.why .ic{width:44px;height:44px;border-radius:12px;background:var(--soft);color:var(--accent);display:grid;place-items:center;margin-bottom:14px}
.why .ic svg{width:24px;height:24px}
.why h3{font-size:19px;margin-bottom:6px}
.why p{color:var(--muted);font-size:15.5px}

/* finder */
.finder{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;margin-bottom:34px}
.finder h3{font-size:22px}
.finder>p{color:var(--muted);margin:4px 0 18px}
.fq{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.fq fieldset{border:0;margin:0;padding:0;min-width:0}
.fq legend{font-weight:600;font-size:15px;margin-bottom:8px;padding:0}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button{font:500 14.5px var(--body);padding:8px 13px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;transition:border-color .15s,background .15s}
.opts button:hover{border-color:var(--accent)}
.opts button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.fres{margin-top:20px;border-top:1px dashed var(--line);padding-top:18px}
.fres .hint{color:var(--muted);font-size:15px}
.fres .out{display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:space-between;animation:rise .5s both}
.fres h4{font:800 24px var(--display);margin:0 0 4px}
.fres ul{margin:6px 0 0;padding-left:20px;color:var(--muted);font-size:15px}
.fres small{display:block;color:var(--muted);margin-top:8px;font-size:13px}
.fres .acts{display:flex;flex-wrap:wrap;gap:10px}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* plans */
.cycle{display:flex;width:max-content;max-width:100%;margin:0 auto 34px;border:1px solid var(--line);border-radius:10px;padding:3px;background:var(--surface);overflow-x:auto}
.cycle button{font:600 15px var(--body);padding:9px 18px;border:0;border-radius:7px;background:transparent;color:var(--muted);cursor:pointer;white-space:nowrap;transition:background .2s,color .2s}
.cycle button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:18px;align-items:start}
.plan{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0;transition:transform .25s ease,box-shadow .25s ease}
.plan:hover{transform:translateY(-5px);box-shadow:var(--shadow)}
.plan.enter{animation:rise .6s both;animation-delay:calc(var(--i,0)*80ms)}
.plan.pop{border:2px solid var(--accent)}
.plan.rec{outline:3px solid var(--signal);outline-offset:3px}
.plan .banner{background:var(--accent);color:var(--accent-ink);font:700 13px var(--body);letter-spacing:.06em;padding:8px 22px;display:flex;justify-content:space-between;gap:8px}
.plan .banner.alt{background:var(--signal);color:var(--surface)}
.plan .in{padding:24px 22px;display:grid;gap:14px}
.plan h3{font-size:24px}
.badges{display:flex;align-items:center;gap:10px;min-height:26px}
.save{font:700 13px var(--body);background:var(--signal-bg);color:var(--signal);padding:3px 10px;border-radius:5px}
.save.mut{background:var(--soft);color:var(--muted)}
.badges s{color:var(--muted);font-size:15px}
.price{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.price strong{font:800 40px/1 var(--display);font-variant-numeric:tabular-nums}
.price span{color:var(--muted);font-size:14px}
.plan .eq{font-size:13.5px;color:var(--accent);font-weight:600;margin-top:-8px}
.plan .who{color:var(--muted);font-size:14.5px;min-height:3.2em}
.plan .renew{font-size:13.5px;color:var(--muted);margin-top:-4px}
.plan ul{list-style:none;margin:6px 0 0;padding:16px 0 0;border-top:1px solid var(--line);display:grid;gap:10px}
.plan li{display:flex;gap:10px;font-size:14.5px;align-items:flex-start}
.plan li i{flex:none;width:16px;height:16px;border-radius:50%;margin-top:4px;display:grid;place-items:center;font:700 10px/1 var(--body);font-style:normal}
.plan li.y i{background:var(--accent);color:var(--accent-ink)}
.plan li.y i::before{content:"✓"}
.plan li.n{color:var(--muted)}
.plan li.n i{background:var(--bkash-bg);color:var(--err)}
.plan li.n i::before{content:"✕"}
.plan .btn{width:100%}

/* compare table */
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:15.5px}
th,td{padding:13px 16px;text-align:left;border-bottom:1px solid var(--line)}
th{font:700 15px var(--display);background:var(--soft)}
tr:last-child td{border-bottom:0}
td:first-child{color:var(--muted)}
td .yes{color:var(--ok);font-weight:700}
td .no{color:var(--err);font-weight:700}
tbody tr:hover td{background:color-mix(in srgb,var(--soft) 50%,transparent)}

/* domain checker */
.dom{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;max-width:760px}
.domrow{display:flex;gap:10px;flex-wrap:wrap}
.domrow input{flex:1 1 220px}
.domres{margin-top:16px;min-height:1px}
.domres .res{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;border-radius:12px;border:1px solid var(--line);animation:rise .4s both}
.domres .res.free{background:var(--soft);border-color:var(--accent)}
.domres .res.taken{background:var(--signal-bg);border-color:var(--signal)}
.domres .res b{display:block;font:700 17px var(--display)}
.domres .res p{color:var(--muted);font-size:14.5px}
.domres .res .em{font-size:22px;line-height:1}
.domres .acts{margin-top:10px}
.domres .ns{font:500 13px var(--mono);overflow-wrap:anywhere;margin-top:6px;color:var(--muted)}

/* steps + faq */
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;counter-reset:s;list-style:none;margin:0;padding:0;position:relative}
.steps li{counter-increment:s;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;position:relative}
.steps li::before{content:counter(s,bengali);font:800 26px var(--display);color:var(--accent);display:block;margin-bottom:6px}
html[lang="en"] .steps li::before{content:counter(s)}
.steps b{display:block;font-family:var(--display);font-size:17px;margin-bottom:4px}
.steps span{color:var(--muted);font-size:15px}
.pay-strip{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-top:30px;padding:18px 20px;border:1px dashed var(--line);border-radius:14px;background:var(--surface)}
.pay-strip p{color:var(--muted);flex:1 1 260px}
.pm{display:inline-flex;align-items:center;gap:8px;font:800 17px var(--display);padding:9px 16px;border-radius:10px}
.pm.bkash{background:var(--bkash-bg);color:var(--bkash)}
.pm.nagad{background:var(--nagad-bg);color:var(--nagad)}
.pm img{height:22px;width:auto}
details{border-bottom:1px solid var(--line);padding-block:16px}
details summary{cursor:pointer;font:700 17px var(--display);list-style:none;display:flex;justify-content:space-between;gap:12px}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"+";color:var(--accent);font-size:22px;line-height:1;transition:transform .25s}
details[open] summary::after{content:"−"}
details p{color:var(--muted);margin-top:10px;max-width:46em;animation:rise .35s both}
.faq{max-width:820px}

/* contact */
.contact{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:30px}
.contact h2{font-size:clamp(24px,3.2vw,32px);font-weight:800;margin-bottom:8px}
.contact p.sub{color:var(--muted)}
.contact form{display:grid;gap:12px}
textarea{font:16px var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px 13px;width:100%;min-height:96px;resize:vertical}
textarea:focus{border-color:var(--accent)}
@media (max-width:760px){.contact{grid-template-columns:1fr;padding:22px}}

footer{border-top:1px solid var(--line);padding-block:28px;color:var(--muted);font-size:14.5px}
footer .wrap{display:flex;flex-wrap:wrap;gap:12px 28px;justify-content:space-between;align-items:center}
footer .fl{display:flex;gap:18px;flex-wrap:wrap}
footer a{text-decoration:none;border-bottom:1px solid var(--line)}
footer a:hover{color:var(--ink);border-color:var(--accent)}
.wa-fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:25;width:54px;height:54px;border-radius:50%;background:#1FA855;color:#fff;display:grid;place-items:center;box-shadow:0 10px 24px -8px rgba(0,0,0,.45);text-decoration:none;transition:transform .2s}
.wa-fab:hover{transform:scale(1.08)}
.wa-fab svg{width:28px;height:28px}
.wa-fab::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid #1FA855;animation:pulse2 2.6s ease-out infinite}
@keyframes pulse2{0%{transform:scale(1);opacity:.8}100%{transform:scale(1.6);opacity:0}}

/* checkout */
.view-pad{padding-block:36px 72px}
.back{background:none;border:0;color:var(--muted);font:500 15px var(--body);cursor:pointer;padding:0;margin-bottom:18px}
.back:hover{color:var(--ink)}
.stepper{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:26px;font-size:14.5px;counter-reset:st}
.stepper span{padding:7px 14px;border-radius:99px;border:1px solid var(--line);color:var(--muted);transition:background .3s,color .3s}
.stepper span.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.stepper span.done{border-color:var(--accent);color:var(--accent)}
.co{display:grid;grid-template-columns:1fr 340px;gap:28px;align-items:start}
@media (max-width:860px){.co{grid-template-columns:1fr}.co .sum{order:-1}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;min-width:0}
.card.anim{animation:rise .45s both}
.card h2{font-size:24px;margin-bottom:6px}
.card .sub{color:var(--muted);margin-bottom:20px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:560px){.fields{grid-template-columns:1fr}.card{padding:18px}}
.fields .full{grid-column:1/-1}
label{display:grid;gap:6px;font-weight:500;font-size:15px}
label small{color:var(--muted);font-weight:400}
input,select{font:16px var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px 13px;width:100%;min-width:0}
input:focus,select:focus{border-color:var(--accent)}
input.bad{border-color:var(--err)}
.err{color:var(--err);font-size:13.5px;min-height:1.2em}
.chk{display:flex;gap:10px;align-items:flex-start;font-weight:400;margin-top:16px}
.chk input{width:20px;height:20px;margin-top:3px;flex:none;accent-color:var(--accent)}
.sum dl{margin:0;display:grid;gap:10px}
.sum .r{display:flex;justify-content:space-between;gap:12px}
.sum dt{color:var(--muted)}
.sum dd{margin:0;font-weight:600;text-align:right}
.sum .total{border-top:1px solid var(--line);padding-top:12px;margin-top:4px;font-size:19px}
.sum .total dd{font-family:var(--display);font-weight:800}
.sum .pick{display:grid;gap:10px;margin-bottom:16px}
.sum .pick label{font-size:13.5px;color:var(--muted)}
.sum .rn{font-size:13px;color:var(--muted);margin-top:12px}
[data-method="bkash"]{--mc:var(--bkash);--mc-bg:var(--bkash-bg);--mc-ink:var(--bkash-ink)}
[data-method="nagad"]{--mc:var(--nagad);--mc-bg:var(--nagad-bg);--mc-ink:var(--nagad-ink)}
.mtabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.mtab{display:flex;align-items:center;justify-content:center;gap:8px;font:800 18px var(--display);padding:14px 10px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);cursor:pointer;transition:border-color .2s,background .2s,transform .15s}
.mtab[data-m="bkash"]{--mc:var(--bkash);--mc-bg:var(--bkash-bg)}
.mtab[data-m="nagad"]{--mc:var(--nagad);--mc-bg:var(--nagad-bg)}
.mtab:hover{transform:translateY(-1px)}
.mtab[aria-pressed="true"]{border-color:var(--mc);background:var(--mc-bg);color:var(--mc)}
.mtab img{height:22px}
.paybox{background:var(--mc-bg);border:1px solid var(--mc);border-radius:14px;padding:20px;display:grid;gap:14px;margin-bottom:22px;animation:rise .4s both}
.paybox .lbl{font:600 13px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--mc)}
.numrow{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:4px}
.num{font:500 clamp(24px,6vw,32px)/1.15 var(--mono);letter-spacing:.04em;user-select:all;overflow-wrap:anywhere}
.num.long{font-size:clamp(19px,5.2vw,28px);letter-spacing:.02em}
.amt{font:800 26px var(--display);margin-top:2px}
.amtrow{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.how{margin:0 0 22px;padding-left:22px;display:grid;gap:7px;color:var(--muted)}
.how b{color:var(--ink);font-weight:600}
.status{display:inline-flex;align-items:center;gap:8px;background:var(--signal-bg);color:var(--signal);font-weight:600;padding:7px 14px;border-radius:99px;margin-bottom:14px}
.status::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--signal);animation:ping2 1.6s infinite}
.status.ok{background:var(--soft);color:var(--ok)}
.status.ok::before{background:var(--ok);animation:none}
@keyframes ping2{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--signal) 55%,transparent)}80%,100%{box-shadow:0 0 0 8px transparent}}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:18px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;font-size:15px;z-index:70;max-width:calc(100% - 32px);animation:rise .25s both}

/* done / receipt */
.dgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:24px;align-items:start}
@media (max-width:900px){.dgrid{grid-template-columns:1fr}}
.okmark{width:76px;height:76px;margin-bottom:12px}
.okmark svg{width:100%;height:100%;overflow:visible}
.okmark circle{fill:var(--soft);stroke:var(--ok);stroke-width:3;stroke-dasharray:152;stroke-dashoffset:152;animation:dash .7s ease-out .1s forwards}
.okmark path{fill:none;stroke:var(--ok);stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:dash .45s ease-out .7s forwards}
@keyframes dash{to{stroke-dashoffset:0}}
.done-card h2{font-size:clamp(26px,4vw,34px)}
.tracker{list-style:none;margin:22px 0 4px;padding:0;display:grid;gap:0}
.tracker li{display:grid;grid-template-columns:34px 1fr;gap:12px;position:relative;padding-bottom:20px}
.tracker li:last-child{padding-bottom:0}
.tracker li::before{content:"";position:absolute;left:16px;top:34px;bottom:0;width:2px;background:var(--line)}
.tracker li:last-child::before{display:none}
.tracker li.done::before{background:var(--ok)}
.tracker .dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);background:var(--surface);font:700 14px var(--display);color:var(--muted)}
.tracker li.done .dot{background:var(--ok);border-color:var(--ok);color:var(--accent-ink)}
.tracker li.now .dot{border-color:var(--signal);color:var(--signal);animation:ping2 1.8s infinite}
.tracker b{display:block;font:700 16px var(--display)}
.tracker small{color:var(--muted);font-size:13.5px}
.nexts{margin:12px 0 0;padding-left:20px;color:var(--muted);display:grid;gap:6px}
.wa-box{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:20px}
.wa-box p{color:var(--muted);font-size:14.5px;margin-bottom:12px}
.wa-box p.t{color:var(--ink);font-weight:600;margin-bottom:4px}
.receipt{padding:0;overflow:hidden;position:relative}
.receipt .rc-head{padding:20px 24px;background:var(--mc);color:var(--mc-ink);display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.receipt .rc-head b{font:800 18px var(--display)}
.receipt .rc-head span{font:500 14px var(--mono);opacity:.95}
.rc{margin:0;padding:8px 24px 4px;display:grid}
.rc .r{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px dashed var(--line);font-size:15px}
.rc dt{color:var(--muted);flex:none}
.rc dd{margin:0;font-weight:600;text-align:right;overflow-wrap:anywhere}
.rc dd.mono{font-family:var(--mono);font-weight:500}
.rc-total{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 24px;background:var(--soft);font:800 20px var(--display)}
.rc-total span:last-child{font-size:26px;color:var(--accent)}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:40}
.confetti i{position:absolute;top:-14px;left:var(--x);width:9px;height:14px;background:var(--c);border-radius:2px;opacity:0;animation:fall var(--t) ease-in var(--dl) forwards}
@keyframes fall{0%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:0;transform:translateY(105vh) rotate(var(--r))}}

/* track */
.trk{max-width:760px}
.orow{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;padding:14px 0;border-bottom:1px solid var(--line)}
.orow:last-child{border-bottom:0}
.orow b{font:600 15px var(--mono)}
.orow small{display:block;color:var(--muted)}
.trkres{margin-top:18px}

/* motion + print */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
  .js .rv{opacity:1;transform:none}
  .marquee .track{animation:none}
  .bar i{width:var(--w)}
}
@media print{
  body{background:#fff;color:#000}
  .top,footer,.wa-fab,#prog,.toast,.noprint,.confetti,body::before,main:not(#v-done) .nonprint{display:none!important}
  main:not(#v-done){display:none!important}
  .view-pad{padding:0}
  .dgrid{display:block}
  .done-card{display:none}
  .card{border:1px solid #999;box-shadow:none}
  .receipt .rc-head{background:#eee!important;color:#000!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .rc-total{background:#f2f2f2!important}
}
@counter-style bengali{system:numeric;symbols:"০" "১" "২" "৩" "৪" "৫" "৬" "৭" "৮" "৯"}
</style>

  faq_h: ["সাধারণ প্রশ্ন", "Common questions"],
  faq1q: ["পেমেন্ট করার পর কখন হোস্টিং চালু হবে?", "When will hosting be activated after I pay?"],
  faq1a: ["TrxID জমা দেওয়ার পর আমরা বিকাশ বা নগদে টাকা জমা হয়েছে কিনা মিলিয়ে দেখি। মিললে অর্ডার নিশ্চিত হয় এবং লগইন তথ্য পাঠানো হয়। যাচাইয়ের আগে অর্ডারটি “যাচাই চলছে” অবস্থায় থাকে।", "After you submit the TrxID, we check that the money arrived in bKash or Nagad. If it matches, the order is confirmed and login details are sent. Until then the order shows as “verification in progress”."],
  faq5q: ["বিকাশ না নগদ — কোনটিতে পেমেন্ট করব?", "bKash or Nagad — which should I pay with?"],
  faq5a: ["যেকোনো একটি। অর্ডারের পেমেন্ট ধাপে মাধ্যম বেছে নিলে সেই মাধ্যমের নম্বর ও পাঠানোর পরিমাণ দেখানো হয়।", "Either one. On the payment step, pick a method and you'll see its number and the exact amount to send."],
  faq2q: ["ভুল TrxID দিলে কী হবে?", "What if I enter a wrong TrxID?"],
  faq2a: ["TrxID পেমেন্ট রেকর্ডের সাথে না মিললে অর্ডার নিশ্চিত হবে না। সঠিক TrxID নিয়ে সাপোর্টে যোগাযোগ করলে অর্ডার আবার দেখা হবে।", "If the TrxID doesn't match the payment record, the order won't be confirmed. Contact support with the correct TrxID and we'll look at it again."],
  faq6q: ["রিসিট কোথায় পাব, অর্ডার ট্র্যাক করব কীভাবে?", "Where is my receipt, and how do I track an order?"],
  faq6a: ["TrxID জমা দিলেই পরের পাতায় রিসিট দেখা যায়; সেখান থেকে প্রিন্ট বা PDF করে রাখতে পারেন। পরে “অর্ডার ট্র্যাক” পাতায় অর্ডার ID দিয়ে দেখা যায়। তবে অর্ডারের তথ্য শুধু যে ডিভাইসে অর্ডার করেছেন সেখানেই সংরক্ষিত থাকে — অন্য ডিভাইসে হলে অর্ডার ID নিয়ে WhatsApp-এ জানান।", "Right after you submit the TrxID, the next page shows your receipt; you can print or save it as PDF. Later, use the “Track order” page with your order ID. Order details are stored only on the device you ordered from — on another device, message us on WhatsApp with your order ID."],
  faq8q: ["মাসিক আর বাৎসরিক প্যাকেজে পার্থক্য কী?", "What's the difference between monthly and yearly plans?"],
  faq8a: ["মেয়াদ বেশি হলে মাসপ্রতি খরচ কমে। প্রথম মেয়াদের পর নবায়নের দাম প্রযোজ্য হয়; দুটো দামই প্যাকেজ কার্ডে পাশাপাশি দেখানো আছে।", "A longer term lowers the monthly cost. After the first term the renewal price applies; both prices are shown side by side on each plan card."],
  faq3q: ["ডোমেইন না থাকলে অর্ডার করা যাবে?", "Can I order without a domain?"],
  faq3a: ["যাবে। ডোমেইন ঘরটি ফাঁকা রাখুন, পরে ডোমেইন যুক্ত করার উপায় জানানো হবে।", "Yes. Leave the domain field empty and we'll tell you how to add a domain later."],
  faq4q: ["অন্য হোস্টিং থেকে সাইট আনা যাবে?", "Can I move my site from another host?"],
  faq4a: ["হ্যাঁ, মাইগ্রেশনের অনুরোধ জানালে আমরা ফাইল ও ডেটাবেস সরাতে সাহায্য করি।", "Yes. Ask for a migration and we'll help move your files and database."],

function stagePay() {

var ID_CH = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
function newOrderId() {
  var d = new Date(), pad = function (n) { return String(n).padStart(2, "0"); }, id;
  do {
    var r = ""; for (var i = 0; i < 4; i++) r += ID_CH.charAt(Math.floor(Math.random() * ID_CH.length));
    id = "DH" + String(d.getFullYear()).slice(2) + pad(d.getMonth() + 1) + pad(d.getDate()) + "-" + r;
  } while (findOrder(id));
  return id;
}
function submitPayment(m) {

  bad = setErr("trx", te, "p-trx") || bad;
  var okErr = $("p-ok").checked ? "" : t("e_confirm"); $("e-ok").textContent = okErr; bad = !!okErr || bad;
  if (bad) { var f = qs("#payForm .bad") || $("p-ok"); f.focus(); return; }
  var p = state.plan, cy = state.cycle, pr = p.price[cy];
  var o = {
    id: newOrderId(), planId: p.id, plan: p.name[1], cycleKey: cy, cycle: cycById(cy) && D["cy_" + cy][1],
    amount: pr[0], renew: pr[1] || null,
    info: {name: state.info.name, phone: state.info.phone, email: state.info.email, domain: state.info.domain},
    method: m.id, to: m.number, sender: sender, trx: trx, status: "verifying", at: new Date().toISOString(), lang: lang
  };
  ORD.unshift(o); saveOrders(); postWebhook(o);
  state.method = m.id; saveDraft();
  state.fresh = o.id; state.pay = {sender: "", trx: "", ok: false};
  nav("#/done/" + o.id);
}
function postWebhook(o) {
  if (!CONFIG.orderWebhook) return;
  try {
    var body = JSON.stringify({id: o.id, at: o.at, plan: o.plan, cycle: o.cycle, amount: o.amount, name: o.info.name, phone: o.info.phone, email: o.info.email, domain: o.info.domain, method: o.method, paidTo: o.to, paidFrom: o.sender, trxId: o.trx, status: o.status, site: location.href.split("#")[0]});
    fetch(CONFIG.orderWebhook, {method: "POST", mode: "no-cors", headers: {"Content-Type": "text/plain;charset=utf-8"}, body: body, keepalive: true}).catch(function () {});
  } catch (e) {}
}

}

  ];

  $("doneWrap").innerHTML =
    '<div class="stepper noprint">' + qs("#stepper").innerHTML + "</div>" +

    '<div class="card noprint anim" style="margin-top:20px"><div class="wa-box" style="margin-top:0"><p class="t">' + t("wa_h") + "</p><p>" + t("wa_note") + '</p><div class="actions" style="margin-top:0"><a class="btn" id="waSend" target="_blank" rel="noopener" href="' + esc(waUrl(waText(o))) + '">' + t("wa_send") + '</a><button class="btn ghost" id="copyOrder" type="button">' + t("copy_info") + "</button></div></div>" +
    '<h3 style="font-size:18px;margin-top:22px">' + t("next_h") + '</h3><ul class="nexts"><li>' + t("next1", {m: esc(mn)}) + "</li><li>" + t("next2") + "</li><li>" + t("next3") + "</li></ul>" +
    '<div class="actions"><button class="btn ghost" id="printBtn" type="button">' + t("print_btn") + '</button><a class="btn ghost" href="#/track">' + t("track_btn") + '</a><button class="btn ghost" id="newOrder" type="button">' + t("new_order") + "</button></div></div>" +
    '</div><div class="card receipt anim" id="receipt" data-method="' + m.id + '"><div class="rc-head"><b>' + esc(brandName()) + " · " + t("rc_h") + "</b><span>" + esc(mn) + "</span></div>" +
    '<dl class="rc">' + rows.map(function (r) { return '<div class="r"><dt>' + r[0] + '</dt><dd class="' + (r[2] || "") + '">' + r[1] + "</dd></div>"; }).join("") + "</dl>" +
    '<div class="rc-total"><span>' + t("r_amt") + "</span><span>" + money(o.amount) + "</span></div></div></div>";
  $("copyOrder").addEventListener("click", function () { copyText(waText(o), null); });
  $("printBtn").addEventListener("click", function () { window.print(); });
  $("newOrder").addEventListener("click", function () { nav("#/"); });
  if (state.fresh === o.id) { state.fresh = null; confetti(); }

function confetti() {
  if (reduced) return;
  var c = document.createElement("div"); c.className = "confetti"; c.setAttribute("aria-hidden", "true");
  var cols = ["var(--accent)", "var(--signal)", "var(--bkash)", "var(--nagad)", "#5B8DEF"], h = "";
  for (var i = 0; i < 42; i++) h += '<i style="--x:' + (Math.random() * 100).toFixed(1) + "%;--c:" + cols[i % cols.length] + ";--t:" + (2.4 + Math.random() * 1.8).toFixed(2) + "s;--dl:" + (Math.random() * 0.6).toFixed(2) + "s;--r:" + Math.round(Math.random() * 720 - 360) + 'deg"></i>';
  c.innerHTML = h; document.body.appendChild(c); setTimeout(function () { if (c.parentNode) c.parentNode.removeChild(c); }, 5200);
}

/* =====================================================================
   Track order page
   ===================================================================== */
function renderTrack() {
  var id = state.trackId || ""; $("trkIn").value = id;
  $("trkRes").innerHTML = id && !findOrder(id) ? '<p class="err" role="alert" style="min-height:0">' + t("trk_nf") + '</p><div class="actions"><a class="btn ghost sm" target="_blank" rel="noopener" href="' + esc(waUrl(t("trk_wa_msg") + " " + id)) + '">' + t("trk_wa") + "</a></div>" : "";
  $("trkList").innerHTML = ORD.length ? ORD.map(function (o) {

  }).join("") : '<p style="color:var(--muted)">' + t("trk_empty") + "</p>";

/* =====================================================================
   Router
   ===================================================================== */
function nav(h) { if (location.hash === h) route(); else location.hash = h; }
function setView(v) {
  var changed = state.view !== v; state.view = v;
  ["home", "checkout", "done", "track", "client"].forEach(function (n) { $("v-" + n).hidden = n !== v; });
  document.body.setAttribute("data-page", v);
  if (v !== "home") qsa(".nav a.on").forEach(function (a) { a.classList.remove("on"); });
  if (changed) window.scrollTo(0, 0);
}
function route() {
  var raw = (location.hash || "").replace(/^#\/?/, "");
  var p = raw.split("/").map(function (x) { try { return decodeURIComponent(x); } catch (e) { return x; } });
  var name = p[0] || "home", prev = state.view;
  if (name === "main" || name === "top" || (name.length && ["checkout", "done", "track", "home", "client"].indexOf(name) < 0 && document.getElementById(name))) return;
  if (name === "checkout") {
    var plan = planById(p[1]), cy = cycById(p[2]);
    if (!plan || !cy) { location.replace("#/"); return; }
    state.plan = plan; state.cycle = cy.k;
    if (prev !== "checkout") { state.stage = 1; state.pay = {sender: "", trx: "", ok: false}; }
    setView("checkout"); renderCheckout();
  } else if (name === "done") {
    var o = findOrder(p[1]);
    if (!o) { location.replace("#/track/" + encodeURIComponent(p[1] || "")); return; }
    state.doneId = o.id; setView("done"); renderDone(o);
  } else if (name === "track") {
    if (p[1] && findOrder(p[1])) { location.replace("#/done/" + encodeURIComponent(findOrder(p[1]).id)); return; }
    state.trackId = p[1] || ""; setView("track"); renderTrack();
  } else if (name === "client") {
    setView("client"); if (window.ClientArea) window.ClientArea.render();
  } else { setView("home"); }
}
function startOrder(id) { nav("#/checkout/" + id + "/" + state.cycle); }
function scrollToEl(sel) { var el = qs(sel); if (el) el.scrollIntoView({behavior: reduced ? "auto" : "smooth", block: "start"}); }
function closeMenu() { var tp = qs(".top"); tp.classList.remove("open"); $("menuBtn").setAttribute("aria-expanded", "false"); }

function renderAll() {
  renderMarquee(); renderPayStrip(); renderCycleBar(); renderPlans(); renderCompare(); renderFinder(); renderDomRes();
  if (state.view === "checkout") renderCheckout();
  else if (state.view === "done") renderDone();
  else if (state.view === "track") renderTrack();
}

   Events

document.addEventListener("click", function (e) {

  if ((el = e.target.closest("[data-order]"))) { startOrder(el.getAttribute("data-order")); return; }
  if ((el = e.target.closest("[data-cy]"))) { state.cycle = el.getAttribute("data-cy"); renderCycleBar(); renderPlans(); renderFinder(); return; }
  if ((el = e.target.closest("[data-q]"))) { state.finder[el.getAttribute("data-q")] = el.getAttribute("data-v"); renderFinder(); return; }
  if ((el = e.target.closest("[data-seeplan]"))) { scrollToEl('.plan[data-id="' + el.getAttribute("data-seeplan") + '"]'); return; }
  if ((el = e.target.closest("[data-m]"))) { state.method = el.getAttribute("data-m"); saveDraft(); renderCheckout(); return; }
  if ((el = e.target.closest("[data-usedom]"))) { state.info.domain = el.getAttribute("data-usedom"); saveDraft(); toast(t("dom_used")); return; }
  if ((el = e.target.closest("[data-view]"))) { nav("#/done/" + encodeURIComponent(el.getAttribute("data-view"))); return; }
  if ((el = e.target.closest("[data-home]"))) { e.preventDefault(); closeMenu(); if (state.view === "home") window.scrollTo({top: 0, behavior: reduced ? "auto" : "smooth"}); else nav("#/"); return; }
  if ((el = e.target.closest("[data-jump]"))) {
    e.preventDefault(); closeMenu();
    var sel = el.getAttribute("href");
    if (state.view !== "home") { nav("#/"); setTimeout(function () { scrollToEl(sel); }, 80); } else scrollToEl(sel);
    return;
  }
  if (e.target.closest(".nav a")) closeMenu();
});
$("themeBtn").addEventListener("click", toggleTheme);

/* ---------- scroll effects ---------- */
(function motion() {
  var prog = $("prog"), ticking = false;
  function onScroll() {
    if (ticking) return; ticking = true;
    requestAnimationFrame(function () {
      var h = document.documentElement, max = h.scrollHeight - h.clientHeight;
      prog.style.width = (max > 0 ? Math.min(100, h.scrollTop / max * 100) : 0) + "%"; ticking = false;
    });
  }
  window.addEventListener("scroll", onScroll, {passive: true});
  if (!("IntersectionObserver" in window)) { qsa(".rv").forEach(function (e) { e.classList.add("in"); }); return; }
  var io = new IntersectionObserver(function (es) {
    es.forEach(function (en) { if (en.isIntersecting) { en.target.classList.add("in"); io.unobserve(en.target); } });
  }, {threshold: 0.12, rootMargin: "0px 0px -6% 0px"});
  qsa(".rv").forEach(function (e) { io.observe(e); });
  var links = {};
  qsa(".nav a[href^='#']").forEach(function (a) { if (a.hasAttribute("data-jump")) links[a.getAttribute("href").slice(1)] = a; });
  var spy = new IntersectionObserver(function (es) {
    es.forEach(function (en) {
      if (!en.isIntersecting) return;
      var id = en.target.id; if (id === "compare") id = "plans";
      Object.keys(links).forEach(function (k) { links[k].classList.toggle("on", k === id); });
    });
  }, {rootMargin: "-40% 0px -55% 0px"});
  ["why", "plans", "compare", "domain", "how", "faq"].forEach(function (id) { var s = $(id); if (s) spy.observe(s); });
})();
if (reduced) { var svg = qs(".net"); if (svg && svg.pauseAnimations) svg.pauseAnimations(); }

/* =====================================================================
   Init
   ===================================================================== */
applyStatic();
renderAll();
route();
})();
